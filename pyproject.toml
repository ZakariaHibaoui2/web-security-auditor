[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-auditor"
version = "1.0.0"
description = "Web security posture auditor: HTTPS redirect, HSTS, CSP analysis, clickjacking, cookies, CORS, information leakage and TLS certificate checks with an A+ to F grade and HTML report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zakaria Hibaoui" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
headerscope = "headerscope.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"headerscope" = ["data/*", "rules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/headerscope/report.py" = ["E501"]
